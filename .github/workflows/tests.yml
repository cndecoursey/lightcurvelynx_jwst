# Continuous integration: run on every push to main, on pull requests, and on demand.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # adds a "Run workflow" button on the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyflakes

      - name: Lint (unused imports, undefined names, syntax errors)
        run: python -m pyflakes jwst_survey.py utils.py scripts tests

      - name: Tests (APT parsing, geometry, simulation, comparison with JETS epoch 1)
        run: python tests/test_jwst_survey.py

      - name: Epoch-1 analysis from the committed header summary
        run: python scripts/analyze_epoch1.py
